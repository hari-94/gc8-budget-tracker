# Keeps the Supabase free-tier project from pausing (it pauses after 7 days idle).
# Every 2 days this writes a heartbeat via public.keepalive() (migration_keepalive.sql).
# Needs repo secrets SUPABASE_URL and SUPABASE_ANON_KEY (Settings -> Secrets -> Actions).
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 9 */2 * *"   # 09:17 UTC on every other day of the month
  workflow_dispatch: {}      # "Run workflow" button for a manual test

permissions:
  actions: write             # lets the last step keep this schedule enabled

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write heartbeat
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -u
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_ANON_KEY as repository secrets."; exit 1
          fi
          base="${SUPABASE_URL%/}"; base="${base%/rest/v1}"
          for attempt in 1 2 3; do
            code=$(curl -s -o resp.txt -w "%{http_code}" -X POST "$base/rest/v1/rpc/keepalive" \
              -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}')
            if [ "$code" = "200" ]; then echo "Heartbeat written at $(cat resp.txt)"; exit 0; fi
            if [ "$code" = "404" ]; then
              # keepalive() not created yet - a read still counts as activity.
              echo "::warning::Run migration_keepalive.sql in Supabase. Falling back to a read."
              code=$(curl -s -o /dev/null -w "%{http_code}" \
                "$base/rest/v1/categories?select=code&limit=1" -H "apikey: $SUPABASE_KEY")
              [ "$code" = "200" ] && { echo "Read OK"; exit 0; }
            fi
            echo "Attempt $attempt failed with HTTP $code"; sleep 30
          done
          echo "::error::Supabase did not respond. If the project is paused, restore it from the Supabase dashboard."
          exit 1

      # GitHub switches off scheduled workflows after 60 days with no commits.
      # Re-enabling it on every run resets that timer.
      - name: Keep this schedule enabled
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
